##### FONT #####
font_size 10.0


##### SCROLLBACK #####
scrollback_lines 5000
scrollback_pager_history_size 1000
scrollback_pager nvim -c "setlocal buftype=nofile bufhidden=wipe noswapfile"


##### WINDOW #####
inactive_text_alpha 0.6
confirm_os_window_close 0


##### LAYOUT #####
enabled_layouts tall,fat,grid,stack


##### TAB BAR #####
tab_bar_edge top
tab_switch_strategy left
tab_bar_style separator
tab_separator ""
tab_title_template " {fmt.fg.red}{bell_symbol}{activity_symbol}{fmt.fg.tab}[{index}] - {title} "
tab_bar_min_tabs 0
tab_bar_margin_width 0.0


##### REMOTE #####
allow_remote_control socket-only
listen_on unix:/tmp/kitty


##### OTHERS #####
enable_audio_bell no
notify_on_cmd_finish invisible 5.0 notify-bell


##### KEYBOARD #####
#clear_all_shortcuts yes
kitty_mod ctrl+alt

map kitty_mod+space next_layout

map ctrl+c copy_and_clear_or_interrupt
map ctrl+v paste_from_clipboard

map kitty_mod+f launch --stdin-source=@screen_scrollback --type=overlay nvim -c 'setlocal buftype=nofile bufhidden=wipe nobuflisted noswapfile' -
map kitty_mod+g launch --stdin-source=@last_cmd_output --type=overlay nvim -c 'setlocal buftype=nofile bufhidden=wipe nobuflisted noswapfile' -

map kitty_mod+enter launch --cwd=current
map kitty_mod+backslash close_window
map kitty_mod+o swap_with_window

map ctrl+j neighboring_window down
map ctrl+k neighboring_window up
map ctrl+h neighboring_window left
map ctrl+l neighboring_window right
map --when-focus-on var:IS_NVIM ctrl+j
map --when-focus-on var:IS_NVIM ctrl+k
map --when-focus-on var:IS_NVIM ctrl+h
map --when-focus-on var:IS_NVIM ctrl+l

map kitty_mod+j kitten relative_resize.py down  3
map kitty_mod+k kitten relative_resize.py up    3
map kitty_mod+h kitten relative_resize.py left  3
map kitty_mod+l kitten relative_resize.py right 3
map --when-focus-on var:IS_NVIM kitty_mod+j
map --when-focus-on var:IS_NVIM kitty_mod+k
map --when-focus-on var:IS_NVIM kitty_mod+h
map --when-focus-on var:IS_NVIM kitty_mod+l

map kitty_mod+t new_tab_with_cwd
map kitty_mod+q close_tab
map kitty_mod+. move_tab_forward
map kitty_mod+, move_tab_backward
map kitty_mod+1 goto_tab 1
map kitty_mod+2 goto_tab 2
map kitty_mod+3 goto_tab 3
map kitty_mod+4 goto_tab 4
map kitty_mod+5 goto_tab 5
map kitty_mod+6 goto_tab 6
map kitty_mod+7 goto_tab 7
map kitty_mod+8 goto_tab 8
map kitty_mod+9 goto_tab 9
map kitty_mod+0 goto_tab 10

map kitty_mod+equal change_font_size all +2.0
map kitty_mod+minus change_font_size all -2.0
map kitty_mod+backspace change_font_size all 0

map kitty_mod+r load_config_file

